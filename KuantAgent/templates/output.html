<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KuantAgent 分析报告</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #fffaf3;
            --bg-soft: #f7eee2;
            --panel: #fffdf9;
            --panel-soft: #fff8ef;
            --line: #e8dccb;
            --line-strong: #d8c4a7;
            --text: #425a4f;
            --text-soft: #77897e;
            --accent: #8eb493;
            --accent-strong: #6f966f;
            --accent-soft: #edf5ec;
            --gold: #e3cfad;
            --warning: #e9c77c;
            --danger: #d98c7a;
            --shadow: 0 22px 44px rgba(118, 138, 126, 0.12);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 16px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(227, 207, 173, 0.24), transparent 22%),
                radial-gradient(circle at top right, rgba(142, 180, 147, 0.16), transparent 18%),
                linear-gradient(180deg, #fffdf9 0%, var(--bg) 100%);
        }

        .page-shell {
            width: min(1280px, calc(100vw - 44px));
            margin: 0 auto;
            padding: 28px 0 56px;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand img {
            width: 54px;
            height: 54px;
            object-fit: contain;
        }

        .brand h1 {
            margin: 0;
            font-size: 1.9rem;
            color: var(--text);
        }

        .brand p {
            margin: 4px 0 0;
            font-size: 0.94rem;
            color: var(--text-soft);
        }

        .nav-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .ghost-button,
        .solid-button {
            border: none;
            cursor: pointer;
            border-radius: 999px;
            padding: 12px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        .ghost-button {
            background: var(--panel);
            border: 1px solid var(--line);
            color: var(--text);
        }

        .solid-button {
            background: linear-gradient(135deg, var(--accent-strong) 0%, var(--accent) 100%);
            color: #fff;
            box-shadow: 0 16px 28px rgba(111, 150, 111, 0.22);
        }

        .ghost-button:hover,
        .solid-button:hover {
            transform: translateY(-1px);
        }

        .hero {
            background: linear-gradient(180deg, rgba(255, 253, 249, 0.96) 0%, rgba(247, 238, 226, 0.92) 100%);
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            padding: 28px 30px;
            margin-bottom: 22px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(142, 180, 147, 0.14);
            color: var(--accent-strong);
            border: 1px solid rgba(142, 180, 147, 0.28);
            font-size: 0.92rem;
            margin-bottom: 14px;
        }

        .hero h2 {
            margin: 0 0 10px;
            font-size: 2.35rem;
            line-height: 1.22;
            color: var(--text);
        }

        .hero p {
            margin: 0;
            color: var(--text-soft);
            line-height: 1.9;
            font-size: 1rem;
        }

        .section-grid {
            display: grid;
            grid-template-columns: repeat(12, minmax(0, 1fr));
            gap: 18px;
            margin-top: 18px;
        }

        .panel {
            grid-column: span 12;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            box-shadow: 0 16px 28px rgba(118, 138, 126, 0.08);
            overflow: hidden;
        }

        .panel-half {
            grid-column: span 6;
        }

        .panel-third {
            grid-column: span 4;
        }

        .panel-header {
            padding: 18px 22px 14px;
            border-bottom: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(255, 248, 239, 0.84) 0%, rgba(255, 253, 249, 0.96) 100%);
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0;
            font-size: 1.16rem;
            color: var(--text);
        }

        .panel-title i {
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: var(--accent-soft);
            color: var(--accent-strong);
        }

        .panel-note {
            margin-top: 10px;
            font-size: 0.92rem;
            color: var(--text-soft);
            line-height: 1.75;
        }

        .panel-body {
            padding: 22px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
        }

        .stat-card {
            background: var(--panel-soft);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
        }

        .stat-card h4 {
            margin: 0 0 8px;
            color: var(--text-soft);
            font-size: 0.92rem;
            font-weight: 600;
        }

        .stat-card p {
            margin: 0;
            font-size: 1.45rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.35;
            word-break: break-word;
        }

        .decision-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 16px;
        }

        .decision-card {
            background: linear-gradient(180deg, rgba(237, 245, 236, 0.82) 0%, rgba(255, 253, 249, 0.96) 100%);
            border: 1px solid rgba(142, 180, 147, 0.28);
            border-radius: 18px;
            padding: 18px;
        }

        .decision-card h4 {
            margin: 0 0 8px;
            font-size: 0.9rem;
            color: var(--text-soft);
        }

        .decision-card p {
            margin: 0;
            font-size: 1.18rem;
            font-weight: 700;
            color: var(--text);
        }

        .summary-box {
            background: #fffaf2;
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
            line-height: 1.85;
            color: var(--text);
        }

        .advice-stack {
            display: grid;
            gap: 12px;
        }

        .advice-card {
            background: var(--panel-soft);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 16px 18px;
        }

        .advice-card h4 {
            margin: 0 0 8px;
            font-size: 0.95rem;
            color: var(--accent-strong);
        }

        .advice-card p {
            margin: 0;
            line-height: 1.8;
            color: var(--text);
        }

        .report-stack {
            display: grid;
            gap: 14px;
        }

        .report-card {
            background: #fffdf9;
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px;
        }

        .report-card h4 {
            margin: 0 0 8px;
            font-size: 1rem;
            color: var(--text);
        }

        .report-card p,
        .report-card pre {
            margin: 0;
            color: var(--text-soft);
            line-height: 1.8;
            font-family: inherit;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .json-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .json-card {
            background: #fcfaf5;
            border: 1px solid var(--line);
            border-radius: 18px;
            overflow: hidden;
        }

        .json-card h4 {
            margin: 0;
            padding: 14px 16px;
            background: rgba(142, 180, 147, 0.1);
            border-bottom: 1px solid var(--line);
            color: var(--text);
            font-size: 0.98rem;
        }

        .json-card pre {
            margin: 0;
            padding: 16px;
            max-height: 260px;
            overflow: auto;
            font-size: 0.9rem;
            line-height: 1.65;
            color: #51675d;
            background: #fffdf9;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .chart-card {
            background: #fffdf9;
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 16px;
        }

        .chart-card h4 {
            margin: 0 0 12px;
            color: var(--text);
        }

        .chart-card img {
            width: 100%;
            display: block;
            border-radius: 14px;
            border: 1px solid var(--line);
        }

        .empty-state {
            padding: 28px;
            text-align: center;
            color: var(--text-soft);
            line-height: 1.9;
        }

        .error-panel {
            border-color: rgba(217, 140, 122, 0.35);
            background: rgba(255, 248, 246, 0.96);
        }

        .error-panel .panel-title i {
            background: rgba(217, 140, 122, 0.14);
            color: var(--danger);
        }

        @media (max-width: 1080px) {
            .panel-half,
            .panel-third {
                grid-column: span 12;
            }

            .stats-grid,
            .decision-grid,
            .json-grid,
            .chart-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 720px) {
            .page-shell {
                width: min(100vw - 24px, 100%);
                padding-top: 18px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .hero {
                padding: 22px 22px 20px;
            }

            .hero h2 {
                font-size: 1.8rem;
            }

            .panel-body,
            .panel-header {
                padding-left: 18px;
                padding-right: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div class="topbar">
            <div class="brand">
                <img src="{{ url_for('serve_assets', filename='logo.png') }}" alt="KuantAgent">
                <div>
                    <h1>KuantAgent 分析报告</h1>
                    <p>围绕数据处理层、算法分析层与智能决策层展开的完整中文分析输出</p>
                </div>
            </div>
            <div class="nav-actions">
                <button class="ghost-button" onclick="window.location.href='{{ url_for('demo') }}'">
                    <i class="fas fa-arrow-left"></i> 返回分析台
                </button>
                <button class="solid-button" onclick="window.print()">
                    <i class="fas fa-file-export"></i> 导出/打印
                </button>
            </div>
        </div>

        <section class="hero">
            <div class="hero-badge">
                <i class="fas fa-seedling"></i>
                <span>研究型智能量化分析原型报告</span>
            </div>
            <h2 id="hero-title">正在加载分析结果…</h2>
            <p id="hero-subtitle">系统将展示本次样本从统一数据处理、结构化算法分析到多智能体裁决的完整链路。</p>
        </section>

        <div id="content-root"></div>
    </div>

    <script>
        const serverResults = {{ results | tojson | safe }};

        function safe(v, fallback = "暂无") {
            if (v === null || v === undefined || v === "") return fallback;
            return v;
        }

        function normalizeResults() {
            const params = new URLSearchParams(window.location.search);
            const expectedRunId = params.get("run_id") || "";
            const sessionResults = sessionStorage.getItem("analysisResults");
            const storedRunId = sessionStorage.getItem("analysisResultsRunId") || "";

            if (expectedRunId && sessionResults && storedRunId === expectedRunId) {
                try {
                    return JSON.parse(sessionResults);
                } catch (error) {
                    console.warn("sessionStorage analysisResults parse failed:", error);
                }
            }

            if (serverResults && Object.keys(serverResults).length) {
                return serverResults;
            }

            return {};
        }

        function panel(title, icon, bodyHtml, note = "", extraClass = "") {
            return `
                <section class="panel ${extraClass}">
                    <div class="panel-header">
                        <h3 class="panel-title"><i class="${icon}"></i><span>${title}</span></h3>
                        ${note ? `<div class="panel-note">${note}</div>` : ""}
                    </div>
                    <div class="panel-body">${bodyHtml}</div>
                </section>
            `;
        }

        function escapeHtml(value) {
            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function renderStats(summary = {}) {
            const windowRows = safe(summary.window_rows, "-");
            const windowSize = safe(summary.window_size, "-");
            return `
                <div class="stats-grid">
                    <div class="stat-card">
                        <h4>数据来源</h4>
                        <p>${safe(summary.data_source)}</p>
                    </div>
                    <div class="stat-card">
                        <h4>原始行数</h4>
                        <p>${safe(summary.raw_rows, "-")}</p>
                    </div>
                    <div class="stat-card">
                        <h4>标准化后行数</h4>
                        <p>${safe(summary.normalized_rows, "-")}</p>
                    </div>
                    <div class="stat-card">
                        <h4>分析窗口</h4>
                        <p>${windowRows} 行 / 窗口 ${windowSize}</p>
                    </div>
                </div>
            `;
        }

        function renderRunMeta(meta = {}) {
            return `
                <div class="stats-grid">
                    <div class="stat-card">
                        <h4>运行编号</h4>
                        <p style="font-size:1.05rem;">${safe(meta.run_id, "-")}</p>
                    </div>
                    <div class="stat-card">
                        <h4>模型提供方</h4>
                        <p>${safe(meta.provider_label || meta.provider, "-")}</p>
                    </div>
                    <div class="stat-card">
                        <h4>模型名称</h4>
                        <p style="font-size:1.05rem;">${safe(meta.model, "-")}</p>
                    </div>
                    <div class="stat-card">
                        <h4>运行时间</h4>
                        <p style="font-size:1.05rem;">${safe(meta.completed_at || meta.started_at, "-")}</p>
                    </div>
                </div>
            `;
        }

        function renderDecision(decision = {}, humanAdvice = {}) {
            return `
                <div class="decision-grid">
                    <div class="decision-card">
                        <h4>最终方向</h4>
                        <p>${safe(decision.decision_label || decision.decision)}</p>
                    </div>
                    <div class="decision-card">
                        <h4>最终置信度</h4>
                        <p>${safe(decision.confidence)}</p>
                    </div>
                    <div class="decision-card">
                        <h4>执行建议</h4>
                        <p>${safe(decision.execution_advice_label || decision.execution_advice)}</p>
                    </div>
                    <div class="decision-card">
                        <h4>风险收益比</h4>
                        <p>${safe(decision.risk_reward_ratio)}</p>
                    </div>
                    <div class="decision-card">
                        <h4>基础方向</h4>
                        <p>${safe(decision.base_decision_label || decision.base_decision)}</p>
                    </div>
                    <div class="decision-card">
                        <h4>校准动作</h4>
                        <p>${safe(decision.ai_action_label || decision.ai_action)}</p>
                    </div>
                    <div class="decision-card">
                        <h4>基础置信度</h4>
                        <p>${safe(decision.base_confidence)}</p>
                    </div>
                    <div class="decision-card">
                        <h4>信号质量</h4>
                        <p>${safe(decision.signal_quality_label || decision.signal_quality)}</p>
                    </div>
                    <div class="decision-card">
                        <h4>执行等级</h4>
                        <p>${safe(decision.execution_grade)}</p>
                    </div>
                </div>
                <div class="summary-box">
                    <strong>裁决摘要：</strong>${safe(decision.justification || decision.raw || humanAdvice.summary)}
                </div>
                <div class="advice-stack" style="margin-top:16px;">
                    <div class="advice-card">
                        <h4>裁决路径</h4>
                        <p>${safe(decision.decision_route)} ｜ ${safe(decision.route_reason)}</p>
                    </div>
                    <div class="advice-card">
                        <h4>校准模式</h4>
                        <p>${safe(decision.calibration_mode)} ｜ 模型角色：${safe(decision.model_role)} ｜ 是否已校准：${safe(decision.calibration_applied)} ｜ AI 复核跳过：${safe(decision.ai_review_skipped)}</p>
                    </div>
                    <div class="advice-card">
                        <h4>困难样本评分</h4>
                        <p>${safe(decision.hard_case_score)} ｜ 预测窗口：${safe(decision.forecast_horizon_bars || decision.forecast_horizon)}</p>
                    </div>
                </div>
                <div class="advice-stack" style="margin-top:16px;">
                    <div class="advice-card">
                        <h4>可解释性投资建议</h4>
                        <p>${safe(humanAdvice.summary)}</p>
                    </div>
                    <div class="advice-card">
                        <h4>当前立场</h4>
                        <p>${safe(humanAdvice.stance)}</p>
                    </div>
                    <div class="advice-card">
                        <h4>建议动作</h4>
                        <p>${safe(humanAdvice.action)}</p>
                    </div>
                </div>
            `;
        }

        function renderReports(results) {
            return `
                <div class="report-stack">
                    <div class="report-card">
                        <h4>Indicator Agent 指标解释报告</h4>
                        <p>${escapeHtml(safe(results.technical_indicators, "暂无指标解释结果"))}</p>
                    </div>
                    <div class="report-card">
                        <h4>Pattern Agent 形态解释报告</h4>
                        <p>${escapeHtml(safe(results.pattern_analysis, "暂无形态解释结果"))}</p>
                    </div>
                    <div class="report-card">
                        <h4>Trend Agent 趋势环境报告</h4>
                        <p>${escapeHtml(safe(results.trend_analysis, "暂无趋势环境报告"))}</p>
                    </div>
                    <div class="report-card">
                        <h4>Decision Agent 裁决摘要</h4>
                        <p>${escapeHtml(safe((results.final_decision || {}).justification || (results.human_advice || {}).summary, "暂无裁决摘要"))}</p>
                    </div>
                </div>
            `;
        }

        function renderJsonCards(results) {
            const items = [
                ["indicator_features", results.indicator_features_json],
                ["pattern_features", results.pattern_features_json],
                ["trend_features", results.trend_features_json],
                ["risk_features", results.risk_features_json],
                ["decision_features", results.decision_features_json],
                ["case_context", results.case_context_json]
            ];

            return `
                <div class="json-grid">
                    ${items.map(([name, content]) => `
                        <div class="json-card">
                            <h4>${name}</h4>
                            <pre>${escapeHtml(safe(content, "暂无内容"))}</pre>
                        </div>
                    `).join("")}
                </div>
            `;
        }

        function renderCharts(results) {
            const cards = [];
            if (results.pattern_chart) {
                cards.push(`
                    <div class="chart-card">
                        <h4>形态辅助图像</h4>
                        <img src="data:image/png;base64,${results.pattern_chart}" alt="Pattern Chart">
                    </div>
                `);
            }
            if (results.trend_chart) {
                cards.push(`
                    <div class="chart-card">
                        <h4>趋势辅助图像</h4>
                        <img src="data:image/png;base64,${results.trend_chart}" alt="Trend Chart">
                    </div>
                `);
            }
            if (!cards.length) return "";
            return panel("辅助图像输出", "fas fa-image", `<div class="chart-grid">${cards.join("")}</div>`, "当前主链路并不依赖图像识别，但若开启辅助图像生成，这里会展示相关输出。");
        }

        function renderPage(results) {
            const root = document.getElementById("content-root");
            if (!results || !Object.keys(results).length) {
                root.innerHTML = panel(
                    "暂无可展示结果",
                    "fas fa-circle-info",
                    `<div class="empty-state">当前页面没有检测到有效的本次运行结果。请返回分析台重新发起分析，系统会为每次运行生成新的运行编号和本地日志。</div>`,
                    "结果页现在只会优先展示当前 run_id 对应的结果，旧缓存不会再自动冒充新分析结果。"
                );
                return;
            }
            const asset = safe(results.asset_name, "未知标的");
            const timeframe = safe(results.timeframe, "未知周期");
            const pipelineSummary = results.pipeline_summary || {};
            const runMetadata = results.run_metadata || {};

            document.getElementById("hero-title").textContent = `${asset} · ${timeframe} 分析报告`;
            document.getElementById("hero-subtitle").textContent = "本报告按 KuantAgent 的三层链路展示：先统一处理原始行情，再生成结构化中间证据，最后由多智能体协同输出可解释性交易建议。";

            if (results.error) {
                root.innerHTML = panel(
                    "分析失败",
                    "fas fa-triangle-exclamation",
                    `<div class="empty-state">${escapeHtml(results.error)}</div>`,
                    "请返回分析台检查模型密钥、网络连接或输入数据格式。",
                    "error-panel"
                );
                return;
            }

            const html = `
                <div class="section-grid">
                    <div class="panel panel-half">
                        <div class="panel-header">
                            <h3 class="panel-title"><i class="fas fa-layer-group"></i><span>运行概览</span></h3>
                            <div class="panel-note">本次分析对象为 <strong>${asset}</strong>，时间尺度为 <strong>${timeframe}</strong>。系统按照论文中的固定窗口设置，仅截取最近 45 行作为主分析窗口。</div>
                        </div>
                        <div class="panel-body">
                            ${renderStats(pipelineSummary)}
                            <div style="margin-top:14px;"></div>
                            ${renderRunMeta(runMetadata)}
                        </div>
                    </div>

                    <div class="panel panel-half">
                        <div class="panel-header">
                            <h3 class="panel-title"><i class="fas fa-filter"></i><span>数据处理层摘要</span></h3>
                            <div class="panel-note">完整原始数据先用于清洗、标准化与窗口筛选，随后系统仅截取最近 45 行固定分析窗口送入主模型。因此，原始行数可能远大于最终分析窗口。</div>
                        </div>
                        <div class="panel-body">
                            <div class="advice-stack">
                                <div class="advice-card">
                                    <h4>时间跨度</h4>
                                    <p>${safe(pipelineSummary.first_timestamp, "暂无")} 至 ${safe(pipelineSummary.last_timestamp, "暂无")}</p>
                                </div>
                                <div class="advice-card">
                                    <h4>标签窗口</h4>
                                    <p>当前软件主分析流程沿用论文中的固定窗口配置：输入窗口 ${safe(pipelineSummary.window_size, "-")}，未来标签窗口 ${safe(pipelineSummary.future_horizon, "-")}。</p>
                                </div>
                                <div class="advice-card">
                                    <h4>设计说明</h4>
                                    <p>原始数据负责提供更完整的行情背景，固定分析窗口则保证了 KuantAgent 与 benchmark 口径一致，从而使软件演示与论文实验共享同一套核心参数设置。</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="panel panel-half">
                        <div class="panel-header">
                            <h3 class="panel-title"><i class="fas fa-compass-drafting"></i><span>最终交易建议</span></h3>
                            <div class="panel-note">此处展示 Direction / Confidence / Execution Advice 等最终裁决结果，以及更接近用户阅读习惯的中文建议。</div>
                        </div>
                        <div class="panel-body">
                            ${renderDecision(results.final_decision || {}, results.human_advice || {})}
                        </div>
                    </div>

                    <div class="panel panel-half">
                        <div class="panel-header">
                            <h3 class="panel-title"><i class="fas fa-users-viewfinder"></i><span>智能决策层 Agent 报告</span></h3>
                            <div class="panel-note">Indicator Agent、Pattern Agent、Trend Agent 先分别给出局部视角，再由 Decision Agent 进行有边界的最终校准。</div>
                        </div>
                        <div class="panel-body">
                            ${renderReports(results)}
                        </div>
                    </div>

                    <div class="panel">
                        <div class="panel-header">
                            <h3 class="panel-title"><i class="fas fa-microchip"></i><span>算法分析层中间结果</span></h3>
                            <div class="panel-note">该部分对应 KuantAgent 的结构化中间表征。系统不会直接把原始价格序列交给大语言模型，而是先生成可验证的中间证据，再进入后续裁决。</div>
                        </div>
                        <div class="panel-body">
                            ${renderJsonCards(results)}
                        </div>
                    </div>

                    ${renderCharts(results)}
                </div>
            `;

            root.innerHTML = html;
        }

        document.addEventListener("DOMContentLoaded", () => {
            const results = normalizeResults();
            renderPage(results);
        });
    </script>
</body>
</html>
